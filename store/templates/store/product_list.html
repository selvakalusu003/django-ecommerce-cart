<!DOCTYPE html>
<html>
<head>
<title>Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <a class="navbar-brand" href="{% url 'product_list' %}">
      MyStore
    </a>

    <div class="ms-auto">
      <a href="{% url 'view_cart' %}" class="btn btn-warning">
         🛒 Go to Cart
      </a>
    </div>

  </div>
</nav>

<div class="container mt-4">

<h1 class="text-center mb-4">Products</h1>

<div class="row">

{% for product in products %}

<div class="col-md-4 mb-4">

<div class="card h-100 shadow">

<img src="{{ product.image.url }}" class="card-img-top" style="height:250px; object-fit:cover;">

<div class="card-body">

<h5 class="card-title">{{ product.name }}</h5>

<p class="card-text">{{ product.description|truncatewords:15 }}</p>

<p><strong>Price:</strong> ₹{{ product.price }}</p>

<p><strong>Stock:</strong> {{ product.stock }}</p>

{% if product.stock > 0 %}
<button class="btn btn-primary" onclick="addToCart({{ product.id }})">
Add to Cart
</button>
{% else %}
<span class="badge bg-danger">Out of Stock</span>
{% endif %}

<a href="{% url 'product_detail' product.id %}" class="btn btn-outline-secondary mt-2">
View Details
</a>

</div>

</div>

</div>

{% endfor %}

</div>

</div>

<script>

function addToCart(productId) {

fetch(`/add-to-cart/${productId}/`)
.then(response => response.json())
.then(data => {
alert(data.message);
});

}

</script>

</body>
</html>
